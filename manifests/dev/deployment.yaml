apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-dev
  namespace: app-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: application
          # The GitHub Action script will automatically overwrite everything after ghcr.io/
          image: ghcr.io/app-dev:latest
          ports:
            - containerPort: 80
      imagePullSecrets:
        - name: ghcr-secret
