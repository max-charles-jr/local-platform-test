apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-dev
  namespace: app-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: application
          # The GitHub Action script will automatically overwrite everything after ghcr.io/
          image: ghcr.io/max-charles-jr/local-platform-test:03dac6522e3dbf19c965ed5af28f360b1c7211c4
          ports:
            - containerPort: 3000
      imagePullSecrets:
        - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: my-app-dev
  namespace: app-dev
spec:
  selector:
    app: my-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
