apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-service
  namespace: local-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-service
  template:
    metadata:
      labels:
        app: web-service
    spec:
      containers:
        - name: web-service
          image: local-registry/web-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "local-dev"
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: local-dev
spec:
  selector:
    app: web-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
