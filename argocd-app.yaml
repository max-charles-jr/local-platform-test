apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-dev
  namespace: argocd # The namespace where ArgoCD itself is running
spec:
  project: default # Default ArgoCD project grouping
  source:
    repoURL: "https://github.com/max-charles-jr/local-platform-test"
    targetRevision: HEAD # Tracks the latest commit (or change to a branch like 'main')
    path: k8s/dev # The folder where Waypoint or GitHub Actions drops the manifests
  destination:
    server: "https://kubernetes.default.svc" # Points to the local cluster ArgoCD lives on
    namespace: argo-dev # The target namespace for the application
  syncPolicy:
    automated:
      prune: true # Automatically delete resources that are removed from Git
      selfHeal: true # Automatically fix drift if someone manually edits the cluster
    syncOptions:
      - CreateNamespace=true # Tells ArgoCD to create the 'dev' namespace if it doesn't exist
